:root {
  /* One idea: three lights. A light is off, live (yellow: your move), green or red, and yellow
     always means the thing to act on, whether that is the live light or the one button on the
     screen. The night road behind is a quiet backdrop. Barlow (drawn from highway signs and
     number plates) is embedded above, so nothing is fetched from anywhere else. */
  --bg: #17181a;
  --panel: #232427;
  --panel2: #2d2f33;
  --rule: #36383d;
  --edge: #4b4d54;
  --fg: #f3f3f1;
  --mut: #9c9ea6;
  --sign: #FFD21F;
  --stop: #ff4133;
  --go: #22d572;
  --body: "Barlow", "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --disp: "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Impact, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: hidden; }   /* nothing may ever widen the page: on a phone that would resize everything behind it. On html only, so the page itself still scrolls. */
body { margin: 0; background: #07090f; color: var(--fg); font-family: var(--body); font-weight: 500; font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--sign); outline-offset: 3px; }
[hidden] { display: none !important; }
p { margin: 0; }

/* The road fills the screen behind everything. It is drawn on a canvas from wherever you have got to. */
#bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #07090f; }
#bg canvas { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; }
#bg::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; background: linear-gradient(to bottom, rgba(7, 9, 15, 0) 0%, rgba(7, 9, 15, 0) 34%, rgba(7, 9, 15, 0.5) 56%, rgba(7, 9, 15, 0.78) 100%); }
.app { position: relative; z-index: 1; max-width: 460px; min-height: 100%; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; padding: 0 18px calc(14px + env(safe-area-inset-bottom)); }
main { flex: 1; display: flex; flex-direction: column; }

/* Header */
.top { display: flex; align-items: center; gap: 2px; height: 54px; flex: none; margin-right: -8px; }
.wordmark { display: flex; align-items: center; gap: 9px; margin-right: auto; font-family: var(--disp); font-weight: 800; font-size: 1.45rem; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.wordmark svg { width: 24px; height: 24px; flex: none; }
.ico { width: 40px; height: 40px; flex: none; display: grid; place-items: center; color: var(--mut); border-radius: 10px; font-weight: 700; font-size: 1.15rem; line-height: 1; }
.ico svg { width: 21px; height: 21px; }
.ico:active { background: var(--panel); color: var(--fg); }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; padding: 0 18px; border: 0; border-radius: 12px; background: linear-gradient(#FFE45C, #F7C600); color: #000; font-weight: 700; font-size: 1.06rem; line-height: 1; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 3px 0 #8a6f00, 0 0 26px rgba(255, 210, 31, 0.22); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 1px 0 #8a6f00; }
.btn.plate { background: linear-gradient(rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03)); color: var(--fg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 3px 0 #08080a; }
.btn.plate:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 1px 0 #08080a; }
.linkish { padding: 6px 0; color: var(--fg); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--mut); }

/* Front page: the goal, where you stand, one button */
.home { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 0 30px; }
.hero { display: grid; place-items: center; padding: 6px 0 14px; }
.hero .sg { width: 150px; height: 150px; filter: drop-shadow(0 0 34px rgba(216, 40, 28, 0.5)); animation: arrive 0.3s ease-out both; }
.sg svg { display: block; width: 100%; height: 100%; }
.pitch { color: #d8d9dd; font-size: 1.1rem; line-height: 1.3; text-align: center; }
.pitch b { display: block; margin-top: 4px; color: var(--fg); font-family: var(--disp); font-weight: 800; font-size: 2rem; line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; }
.today { min-height: 1.45em; margin-top: 4px; color: var(--mut); font-size: 0.95rem; text-align: center; }
.today b { color: var(--fg); font-weight: 700; }
.card { padding: 14px 16px; background: var(--panel); border-radius: 12px; }
.card .btn { margin-top: 12px; height: 46px; }
.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--mut); font-size: 0.92rem; }

/* Lights: the goal and the score. Off, live, green, red. */
.lights { display: flex; align-items: center; gap: 10px; flex: none; }
.lt { display: block; flex: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(8, 9, 13, 0.75); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.24); font-style: normal; }
.lt.now { background: radial-gradient(circle at 36% 30%, #fff6c2, #FFD21F 46%, #c79a00); box-shadow: 0 0 0 3px rgba(255, 210, 31, 0.18), 0 0 20px rgba(255, 210, 31, 0.75); animation: live 1.8s ease-in-out infinite; }
.lt.green { background: radial-gradient(circle at 36% 30%, #c9ffe0, #22d572 46%, #0c8a45); box-shadow: 0 0 0 3px rgba(34, 213, 114, 0.18), 0 0 22px rgba(34, 213, 114, 0.8); }
.lt.red { background: radial-gradient(circle at 36% 30%, #ffd0ca, #ff4133 46%, #b0180d); box-shadow: 0 0 0 3px rgba(255, 65, 51, 0.18), 0 0 22px rgba(255, 65, 51, 0.75); }
.lt.lit { animation: lit 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.25) both; }
.lt.sm { display: inline-block; width: 14px; height: 14px; box-shadow: none; }
.lights.mid { justify-content: center; gap: 18px; margin: 8px 0 12px; }
.lights.mid .lt { width: 40px; height: 40px; }
.lights.big { justify-content: center; gap: 20px; }
.lights.big .lt { width: 62px; height: 62px; }
.lights.big.fresh .lt { animation: lit 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.25) both; }
.lights.big.fresh .lt:nth-child(2) { animation-delay: 0.14s; }
.lights.big.fresh .lt:nth-child(3) { animation-delay: 0.28s; }

/* Play: one instrument. The lights, the clock, and a fuse burning from the clock towards the lights. */
.play { flex: 1; display: flex; flex-direction: column; }
.hud { display: flex; align-items: center; height: 56px; flex: none; }
.hud .lights { gap: 8px; }
.hud .lt { width: 30px; height: 30px; }
.chip { min-width: 0; max-width: 46%; color: var(--sign); font-family: var(--disp); font-weight: 800; font-size: 1.7rem; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hudn { margin-left: 10px; color: #d8d9dd; font-size: 0.98rem; font-weight: 700; white-space: nowrap; }
.fuse { position: relative; flex: 1; min-width: 30px; height: 6px; margin: 0 14px 0 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.13); }
.chip + .fuse, .hudn + .fuse { margin-left: 12px; }
.fuse i { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 3px; background: var(--sign); box-shadow: 0 0 10px rgba(255, 210, 31, 0.55); transform-origin: left center; transition: transform 0.2s linear; }
.fuse b { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: radial-gradient(circle, #fff 0, #fff 22%, #FFD21F 44%, rgba(255, 150, 31, 0) 72%); box-shadow: 0 0 16px 4px rgba(255, 190, 31, 0.85); transition: left 0.2s linear; animation: spark 0.34s steps(2) infinite; }
.clock { flex: none; color: var(--fg); font-family: var(--disp); font-weight: 800; font-size: 2.9rem; line-height: 1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7); }
/* the last seconds: the fuse is nearly at the lights, and every light still to be won flashes red */
.hud.low .clock { color: #ff5a4d; }
.hud.low .fuse i { background: #ff4133; box-shadow: 0 0 10px rgba(255, 65, 51, 0.6); }
.hud.low .fuse b { background: radial-gradient(circle, #fff 0, #fff 22%, #ff4133 44%, rgba(255, 65, 51, 0) 72%); box-shadow: 0 0 16px 4px rgba(255, 65, 51, 0.85); }
.hud.low .lt.off { animation: warn 0.6s steps(1) infinite; }
.hud.low .lt.now { animation: warnnow 0.6s steps(1) infinite; }
/* stopped: the clock keeps its place and shows it is paused */
.hud.stopped .clock { color: rgba(243, 243, 241, 0.5); }
.hud.stopped .clock::before { content: ""; display: inline-block; width: 5px; height: 0.56em; margin-right: 10px; border-left: 5px solid currentColor; border-right: 5px solid currentColor; vertical-align: 0.07em; }
.hud.stopped .fuse i { background: rgba(255, 255, 255, 0.45); box-shadow: none; }
.hud.stopped .fuse b { display: none; }
.say { font-family: var(--disp); font-weight: 800; font-size: 2.3rem; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; animation: arrive 0.25s ease-out both; }
.say.green { color: #3ddc84; text-shadow: 0 0 24px rgba(34, 213, 114, 0.5); }
.say.red { color: #ff5a4d; text-shadow: 0 0 24px rgba(255, 65, 51, 0.45); }

/* The question is set straight on the road: no card */
.plate-q { flex: none; margin-top: 12px; padding: 14px 16px 16px; border-radius: 14px; background: rgba(8, 9, 13, 0.84); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09), 0 10px 30px rgba(0, 0, 0, 0.4); }
.lvl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; color: var(--mut); font-size: 0.92rem; line-height: 1; }
.lvl span { color: var(--fg); font-weight: 700; }
.lvl b { font-weight: 500; }
.q { font-weight: 700; font-size: 1.5rem; line-height: 1.26; text-wrap: pretty; }
.q.long { font-size: 1.24rem; line-height: 1.32; }

.entry { margin-top: auto; padding-top: 14px; }
/* The answer field is always live: a yellow ring and a blinking caret say this is where the number goes */
.read { display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 12px; background: #000; color: var(--sign); box-shadow: inset 0 0 0 2px rgba(255, 210, 31, 0.6), inset 0 6px 14px rgba(0, 0, 0, 0.9); }
.read .ph::before, .read .v b::after { content: ""; display: inline-block; width: 3px; height: 1.15em; border-radius: 1px; background: var(--sign); vertical-align: -0.2em; animation: blink 1.1s steps(1) infinite; }
.read .ph::before { margin-right: 8px; }
.read .v b::after { height: 0.82em; margin-left: 4px; vertical-align: -0.04em; }
.read .v { display: inline-flex; align-items: baseline; gap: 8px; font-family: var(--disp); font-weight: 800; font-size: 2.3rem; line-height: 1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; text-shadow: 0 0 16px rgba(255, 210, 31, 0.55); }
.read .u { text-shadow: none; font-family: var(--body); font-weight: 500; font-size: 1rem; letter-spacing: 0; color: var(--fg); }
.read .ph { text-shadow: none; font-family: var(--body); font-weight: 500; font-size: 1rem; letter-spacing: 0; color: #7d7f87; }
.read.shake { animation: shake 0.36s; }
.read.pop .v { animation: pop 0.08s; }
.read.locking { animation: hold 0.44s ease-in both; }
.read.good { color: #3ddc84; box-shadow: inset 0 0 0 2px #22d572, 0 0 26px rgba(34, 213, 114, 0.55); }
.read.good .v { text-shadow: 0 0 16px rgba(34, 213, 114, 0.6); }
.read.good .v b::after { display: none; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; margin-top: 10px; padding-bottom: 4px; }
.pad button { height: 50px; display: grid; place-items: center; background: linear-gradient(#383a41, #26272c); border-radius: 10px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.11), 0 3px 0 #08080a; font-weight: 700; font-size: 1.4rem; line-height: 1; }
.pad button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.11), 0 1px 0 #08080a; }
.pad button svg { width: 26px; height: 19px; }
.pad .zero { grid-column: span 3; }
.pad .lock { grid-row: span 2; height: auto; background: linear-gradient(#FFE45C, #F7C600); color: #000; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 3px 0 #8a6f00, 0 0 26px rgba(255, 210, 31, 0.25); font-size: 1.02rem; line-height: 1.18; }
.pad .lock:active { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 1px 0 #8a6f00; }

/* Computers: the same keypad, which can be clicked, and the keyboard works too */
body.desk .app { max-width: 540px; }
body.desk .home, body.desk .end, body.desk .pass, body.desk .numbers { width: 100%; max-width: 460px; margin-left: auto; margin-right: auto; }
body.desk .plate-q { margin-top: 3vh; }
body.desk .entry { margin-top: 26px; }
body.desk .q { font-size: 1.7rem; }
body.desk .q.long { font-size: 1.36rem; }
body.desk .pad button:hover { filter: brightness(1.14); }

/* After an answer: the answer, one line on why, one button */
.result { position: relative; flex: 1; display: flex; flex-direction: column; padding: 16px 0 0; }
/* a soft dim over the whole backdrop wherever there is a lot to read: no edges */
.result::before, .pass::before, .rev::before, .numbers::before { content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; background: rgba(7, 9, 15, 0.42); pointer-events: none; }
.pass::before, .rev::before, .numbers::before { background: rgba(7, 9, 15, 0.74); }
.result .say { align-self: flex-start; margin-bottom: 12px; transform-origin: left center; }
.result .lab { color: var(--mut); font-weight: 700; font-size: 0.92rem; }
.result .big { font-family: var(--disp); font-weight: 800; font-size: 2.7rem; line-height: 1.02; letter-spacing: 0.01em; }
.result .big.sm { font-size: 2.2rem; }
.result .you { margin-top: 4px; font-size: 1.04rem; line-height: 1.3; }
.why { margin-top: 12px; color: #e3e3e0; font-size: 1.04rem; line-height: 1.45; }
.crowd { margin-top: 10px; color: #c3c5cc; font-size: 0.95rem; line-height: 1.36; }
.crowd:empty { display: none; }
.quiet { align-self: center; margin-top: 8px; color: var(--mut); font-weight: 500; font-size: 0.95rem; text-decoration-color: rgba(255, 255, 255, 0.25); }
.result .quiet { align-self: flex-start; margin-bottom: 18px; }
/* the one button sits at the bottom of the screen, where the Lock in key was, and stays in view on a short screen */
.result .btn { margin-top: auto; position: -webkit-sticky; position: sticky; bottom: calc(14px + env(safe-area-inset-bottom)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 3px 0 #8a6f00, 0 -8px 22px 6px rgba(7, 9, 15, 0.8); }
body.desk .result { flex: none; }
body.desk .result .btn { margin-top: 6px; position: static; }

/* Score: the same three lights, large, and one number */
.end { flex: 1; display: flex; flex-direction: column; padding: 6px 0 4px; }
.score { display: grid; justify-items: center; padding: 14px 0 4px; text-align: center; }
.endno { margin-bottom: 18px; color: var(--mut); font-weight: 700; font-size: 0.92rem; }
.tally { margin-top: 18px; font-family: var(--disp); font-weight: 800; font-size: 5.2rem; line-height: 0.92; letter-spacing: 0.01em; text-shadow: 0 4px 26px rgba(0, 0, 0, 0.7); }
.total { margin-top: 8px; color: #e6e7ea; font-size: 1.1rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
.standing { margin-top: 12px; color: #c3c5cc; text-align: center; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
.standing b { color: var(--fg); font-weight: 700; }
.standing:empty { display: none; }
.standing .first { color: var(--sign); }
.spread { display: grid; gap: 3px; width: min(100%, 320px); margin: 8px auto 0; font-size: 0.8rem; line-height: 1.15; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
.spread:empty { display: none; }
.drow { display: grid; grid-template-columns: 58px 1fr 66px; align-items: center; gap: 8px; color: var(--mut); }
.drow .db { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.drow .db i { display: block; height: 100%; min-width: 3px; border-radius: 4px; background: #7b7e88; }
.drow .dn { white-space: nowrap; }
.drow em { font-style: normal; color: var(--go); }
.drow.me { color: var(--fg); font-weight: 700; }
.drow.me .db i { background: var(--go); }
.sheet .spread { width: 100%; margin: 0; font-size: 0.9rem; }
/* Making room for the chart on mid-height phones: smaller lights and score first, then one sentence, and on
   the shortest screens no chart at all (it is also in Your record). */
@media (max-height: 735px) { .end:not(.haslast) .tally { margin-top: 12px; font-size: 4rem; } .end:not(.haslast) .lights.big .lt { width: 50px; height: 50px; } .end:not(.haslast) .endno { margin-bottom: 12px; } }
@media (max-height: 689px) { .standing .more { display: none; } }
@media (max-height: 635px) { .end:not(.haslast) .spread { display: none; } }
@media (max-height: 619px) { .end.haslast .spread { display: none; } }
@media (max-height: 600px) { .standing { margin-top: 8px; font-size: 0.95rem; } }
.total .streak { color: var(--fg); font-weight: 700; }
.btn.two { flex-direction: column; gap: 4px; height: 60px; }
.btn.two small { font-weight: 600; font-size: 0.84rem; opacity: 0.72; }
.last { margin: 2px 0 4px; padding: 11px 14px 12px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; background: rgba(8, 9, 13, 0.74); }
.last .say { font-size: 1.5rem; animation: none; }
.lastans { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.lastans span { color: var(--mut); font-weight: 700; font-size: 0.92rem; white-space: nowrap; }
.lastans b { font-family: var(--disp); font-weight: 800; font-size: 1.9rem; line-height: 1.05; }
.last .why { margin-top: 5px; font-size: 0.94rem; line-height: 1.38; }
.end.haslast .score { grid-template-columns: auto auto; grid-template-rows: auto auto auto; justify-content: center; align-items: center; column-gap: 18px; padding: 12px 0 0; text-align: left; justify-items: start; }
.end.haslast .endno { grid-column: 2; grid-row: 1; margin: 0; font-size: 0.86rem; }
.end.haslast .lights.big { grid-column: 1; grid-row: 1 / span 3; gap: 10px; }
.end.haslast .lights.big .lt { width: 34px; height: 34px; }
.end.haslast .tally { grid-column: 2; grid-row: 2; margin: 0; font-size: 2.5rem; line-height: 1; }
.end.haslast .total { grid-column: 2; grid-row: 3; margin: 0; font-size: 1rem; }
.end.haslast .standing { margin-top: 6px; }
.end.haslast .endbtns { margin-top: 12px; gap: 10px; }
.end.haslast .foot { padding-top: 10px; }
.end.haslast .keep { padding-top: 9px; }
@media (max-height: 699px) {   /* a short or mid-height phone, with the last answer on the result screen: keep it to one screen */
  .end.haslast .last { padding: 9px 12px 10px; }
  .end.haslast .last .say { font-size: 1.3rem; }
  .end.haslast .lastans b { font-size: 1.6rem; }
  .end.haslast .last .why { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .end.haslast .score { padding-top: 8px; }
  .end.haslast .lights.big .lt { width: 28px; height: 28px; }
  .end.haslast .tally { font-size: 2.1rem; }
  .end.haslast .endbtns { margin-top: 9px; gap: 8px; }
  .end.haslast .btn.two { height: 54px; }
  .end.haslast .pair .btn { height: 46px; }
  .end.haslast .foot { padding-top: 8px; }
  .end.haslast .keep { padding-top: 7px; font-size: 0.95rem; }
  .end.haslast .nextset b { font-size: 1.45rem; }
  .end.haslast .standing { margin-top: 2px; font-size: 0.95rem; }
  .end.haslast .keep + .nextset { padding-top: 1px; }
  .end.haslast .foot .quiet { padding: 4px 0 3px; }
}
.keep { width: 100%; padding-top: 12px; border-top: 1px solid var(--rule); color: #e6e7ea; font-weight: 600; text-align: center; }
.keep + .nextset { padding-top: 4px; border-top: 0; }
.rank { margin-top: 12px; color: var(--sign); font-family: var(--disp); font-weight: 800; font-size: 1.9rem; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; }
.endbtns { display: grid; gap: 13px; margin-top: 18px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.foot { display: grid; justify-items: center; margin-top: auto; padding-top: 16px; }
.foot .quiet { margin-top: 0; padding: 7px 0 5px; }
body.desk .foot { margin-top: 26px; }
.nextset { width: 100%; display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 4px; border-top: 1px solid var(--rule); color: var(--mut); font-weight: 700; }
.nextset b { color: var(--fg); font-family: var(--disp); font-weight: 800; font-size: 1.7rem; line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.end h2, .sheet h2 { margin: 26px 0 10px; color: var(--mut); font-size: 0.95rem; font-weight: 700; line-height: 1.2; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nums b { display: block; font-family: var(--disp); font-weight: 800; font-size: 1.7rem; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nums span { color: var(--mut); font-size: 0.85rem; }
.dist { display: grid; gap: 5px; }
.dist div { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; color: var(--mut); font-weight: 700; font-size: 0.9rem; }
.dist i { display: block; min-width: 28px; padding: 2px 8px; border-radius: 4px; background: var(--panel2); color: var(--fg); font-style: normal; text-align: right; }
.dist i.hi { background: #12924A; color: #fff; }
.beaten { margin-top: 14px; color: var(--mut); }
.recap { list-style: none; margin: 0; padding: 0; }
.recap li { padding: 14px 0; border-top: 1px solid var(--rule); }
.recap .ra { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.recap .ra b { font-family: var(--disp); font-weight: 800; font-size: 1.35rem; line-height: 1; letter-spacing: 0.01em; }
.recap .rt { color: var(--mut); font-size: 0.9rem; }
.recap .rw { margin: 6px 0 0; color: #c3c5cc; font-size: 0.95rem; }
.recap .rq { margin: 0; font-weight: 700; }
.recap .linkish { margin-top: 4px; align-self: auto; }

/* Head to head with a friend's score */
.duel { margin-top: 16px; }
.duel .dh { font-weight: 700; font-size: 1.1rem; }
.duel .dr { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--mut); }
.duel .dr b { color: var(--fg); font-family: var(--disp); font-weight: 800; font-size: 1.25rem; }

/* One phone, passed round */
.pass { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 8px 0 28px; }
.pass .sm { color: var(--mut); }
.pass .who { font-family: var(--disp); font-weight: 800; font-size: 3.8rem; line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; overflow-wrap: anywhere; }
.pass .btn { margin-top: 10px; }
.table { list-style: none; margin: 16px 0 0; padding: 0; }
.table li { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); font-weight: 700; }
.table li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table li small { color: var(--mut); font-weight: 500; font-size: 0.88rem; white-space: nowrap; }
.table li b { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; font-family: var(--disp); font-weight: 800; font-size: 1.5rem; line-height: 1; white-space: nowrap; }
.rev { padding: 6px 0 24px; }
.rev .answer { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 8px; }
.rev .answer span { color: var(--mut); font-weight: 700; }
.rev .answer b { font-family: var(--disp); font-weight: 800; font-size: 2.3rem; line-height: 1; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.prow.hid { visibility: hidden; }
.prow .lt { width: 30px; height: 30px; }
.prow.show .lt { animation: lit 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.25) both; }
.prow .nm { min-width: 0; font-weight: 700; font-size: 1.1rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .said { display: block; color: var(--mut); font-weight: 500; font-size: 0.9rem; }
.rev .after { display: grid; gap: 14px; margin-top: 14px; }
.rev .after.hid { visibility: hidden; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.names input { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border: 1px solid var(--edge); border-radius: 10px; background: #000; color: var(--fg); font-family: var(--body); font-weight: 700; font-size: 1rem; }
.names input::placeholder { color: #6f7178; }
.choice { display: block; width: 100%; margin-bottom: 10px; padding: 14px 16px; text-align: left; background: var(--panel2); border-radius: 12px; }
.choice:active { background: #3b3d43; }
.choice b { display: block; font-weight: 700; font-size: 1.08rem; }
.choice span { display: block; margin-top: 4px; color: var(--mut); font-size: 0.95rem; line-height: 1.36; }

/* The numbers page */
.numbers { padding: 6px 0 30px; }
.numbers table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 0.9rem; }
.numbers th, .numbers td { padding: 6px 4px; border-top: 1px solid var(--rule); text-align: right; }
.numbers th:first-child, .numbers td:first-child { text-align: left; }
.numbers .lv td { padding-top: 18px; border: 0; color: var(--sign); font-weight: 700; text-align: left; }

/* Sheets */
.veil { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; background: rgba(0, 0, 0, 0.72); display: flex; align-items: flex-start; justify-content: center; padding: 44px 12px 12px; overflow: auto; }
.sheet { width: 100%; max-width: 440px; background: var(--panel); border-radius: 16px; padding: 10px 18px 22px; }
.sheet-top { display: flex; justify-content: flex-end; margin-right: -8px; }
.sheet .big { margin: 0 0 12px; color: var(--fg); font-family: var(--disp); font-weight: 800; font-size: 1.9rem; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; }
.sheet p { margin-bottom: 12px; }
.sheet .small { color: var(--mut); font-size: 0.88rem; }
.sheet ul { margin: 0 0 14px; padding-left: 1.15em; }
.sheet li { margin-bottom: 6px; }
.eg { margin: 16px 0; padding: 14px 0 2px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.eg .egq { font-weight: 700; }
.eg .line { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.eg .line p { margin: 0; }
.eg .line b { font-weight: 700; }
.eg .line span { display: block; color: var(--mut); font-size: 0.93rem; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .lab { color: var(--mut); font-weight: 700; font-size: 0.9rem; }
.field input { width: 100%; height: 54px; border: 1px solid var(--edge); border-radius: 10px; background: #000; color: var(--sign); font-family: var(--disp); font-weight: 800; font-size: 1.8rem; letter-spacing: 0.18em; text-align: center; text-transform: uppercase; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; }
.stepper button { height: 46px; background: var(--panel2); border-radius: 10px; font-weight: 700; font-size: 1.4rem; line-height: 1; }
.stepper button:active { background: #3b3d43; }
.stepper output { text-align: center; font-family: var(--disp); font-weight: 800; font-size: 1.7rem; }
.sharetext { margin: 0 0 12px; padding: 12px; border: 1px dashed var(--edge); border-radius: 10px; font-family: var(--body); font-size: 1rem; white-space: pre-wrap; user-select: all; -webkit-user-select: all; }

.toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 40; max-width: calc(100% - 24px); background: var(--fg); color: #000; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 0.93rem; width: max-content; text-align: center; pointer-events: none; }
.oops { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--fg); color: #000; font-weight: 700; }
.oops[hidden] { display: none; }
.oops button { margin-left: 12px; padding: 8px 16px; border-radius: 8px; background: #000; color: #fff; font-weight: 700; }
.noscript { max-width: 420px; margin: 30vh auto 0; padding: 0 24px; text-align: center; }

@keyframes arrive { 0% { transform: scale(1.22); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 30%, 70% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(0.94); } 100% { transform: scale(1); } }

@keyframes warn { 0%, 49% { background: radial-gradient(circle at 36% 30%, #ffd0ca, #ff4133 46%, #b0180d); box-shadow: 0 0 0 3px rgba(255, 65, 51, 0.18), 0 0 18px rgba(255, 65, 51, 0.7); } 50%, 100% { background: rgba(8, 9, 13, 0.75); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.24); } }
@keyframes warnnow { 0%, 49% { background: radial-gradient(circle at 36% 30%, #ffd0ca, #ff4133 46%, #b0180d); box-shadow: 0 0 0 3px rgba(255, 65, 51, 0.18), 0 0 18px rgba(255, 65, 51, 0.7); } 50%, 100% { background: radial-gradient(circle at 36% 30%, #fff6c2, #FFD21F 46%, #c79a00); box-shadow: 0 0 0 3px rgba(255, 210, 31, 0.18), 0 0 20px rgba(255, 210, 31, 0.75); } }
@keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@keyframes lit { 0% { transform: scale(0.55); filter: brightness(2.4); } 100% { transform: none; filter: none; } }

}
@media (prefers-reduced-motion: reduce) {
  .read.shake, .read.pop .v, .read.locking, .hero .sg, .say, .fuse b, .hud.low .lt.off, .hud.low .lt.now, .read .ph::before, .read .v b::after, .lt.now, .lt.lit, .lights.big.fresh .lt, .prow.show .lt { animation: none; }
  .fuse i, .fuse b { transition: none; }
}

<body>
<noscript><p class="noscript">Not So Fast needs JavaScript to run. Turn it on in your browser settings, then reload.</p></noscript>
<div id="bg" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="top">
    <button class="wordmark" data-act="home" aria-label="Not So Fast, home">
      <svg viewBox="0 0 120 120" aria-hidden="true"><polygon points="37,6 83,6 114,37 114,83 83,114 37,114 6,83 6,37" fill="#fff"></polygon><polygon points="40,14 80,14 106,40 106,80 80,106 40,106 14,80 14,40" fill="#D8281C"></polygon><rect x="30" y="51" width="60" height="18" rx="4" fill="#fff"></rect></svg>
      <span id="brand"></span>
    </button>
    <button class="ico" data-act="sound" id="snd" aria-label="Sound"></button>
    <button class="ico" data-act="stats" aria-label="Your record">
      <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="11" width="4.5" height="9" rx="1" fill="currentColor"></rect><rect x="8.75" y="5" width="4.5" height="15" rx="1" fill="currentColor"></rect><rect x="15.5" y="2" width="4.5" height="18" rx="1" fill="currentColor"></rect></svg>
    </button>
    <button class="ico" data-act="help" aria-label="How to play">?</button>
  </header>
  <main id="view"></main>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.38"></stop><stop offset="0.42" stop-color="#fff" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.22"></stop></linearGradient></defs></svg>
<div id="toast" class="toast" role="status" hidden></div>
<div id="oops" class="oops" role="alert" hidden><span>Something went wrong.</span><button data-act="reload">Reload</button></div>
<div id="veil" class="veil" hidden></div>

<script>
/* Not So Fast question engine. No DOM in this file.
   Every question must pass three tests:
   1. Sayable: short enough to ask a friend from memory.
   2. No real calculation: once you see it, the sum is one easy step.
   3. One illusion: a single obvious answer that is wrong, and a click when you see why.
   And one rule of fairness: a minute of thinking must be able to reach the answer. No trivia.

   Every kind of question has a grade from 1 to 5, judged against a running clock:
   1. a giveaway   2. easy, but with a real trap   3. tricky   4. hard   5. most people miss it.
   A day climbs 2, 3, 4: it starts with something that can catch you and ends with something a
   minute of thought can still reach. Grades 1 and 5 never appear in the daily three; they are for
   endless mode. The grades are estimates until the live counters say otherwise: each question
   carries a `kind` so real results can be read back and the grades re-sorted (see GRADE below). */
(function (root) {
  'use strict';

  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  }
  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function rngFrom(str) { return mulberry32(xmur3(str)()); }
  function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function walk(r, turn, list) { return typeof turn === 'number' ? list[turn % list.length] : pick(r, list); }
  function shuffle(r, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function num(n) { return (Math.round(n * 100) / 100).toLocaleString('en-GB', { maximumFractionDigits: 2 }); }
  function eur(n) { return '€' + num(n); }
  function cents(c) { return '€' + (c / 100).toFixed(2); }
  function ord(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function pl(n, one, many) { return n === 1 ? one : many; }

  const F = [];
  function fam(id, level, gen) { F.push({ id: id, level: level, gen: gen }); }

  /* ---------- Level 1: the opener. Instant to read, instant to get wrong. ---------- */

  fam('sumdiff', 2, function (r) {
    if (r() < 0.6) {
      const p = pick(r, [['bat', 'ball'], ['burger', 'drink'], ['coffee', 'biscuit'], ['pen', 'pencil'], ['kite', 'string']]);
      const c = pick(r, [5, 10, 15, 20, 25]), total = 100 + 2 * c;
      return { q: 'A ' + p[0] + ' and a ' + p[1] + ' cost ' + cents(total) + '. The ' + p[0] + ' costs €1.00 more than the ' + p[1] + '. How much is the ' + p[1] + '?', suf: 'cents', a: c, baits: [2 * c], why: 'If the ' + p[1] + ' were ' + (2 * c) + ' cents, the ' + p[0] + ' would be ' + cents(100 + 2 * c) + ' and the two would cost ' + cents(100 + 4 * c) + '.', v: { t: 'sumdiff', total: total, diff: 100 } };
    }
    const p = pick(r, [['phone', 'case'], ['bike', 'helmet'], ['laptop', 'mouse'], ['guitar', 'strap']]);
    const D = pick(r, [100, 1000]), c = D === 100 ? pick(r, [5, 10, 20]) : pick(r, [50, 100]), total = D + 2 * c;
    return { q: 'A ' + p[0] + ' and a ' + p[1] + ' cost ' + eur(total) + '. The ' + p[0] + ' costs ' + eur(D) + ' more than the ' + p[1] + '. How much is the ' + p[1] + '?', pre: '€', a: c, baits: [2 * c], why: 'If the ' + p[1] + ' were ' + eur(2 * c) + ', the ' + p[0] + ' would be ' + eur(2 * c + D) + ' and the two would cost ' + eur(4 * c + D) + '.', v: { t: 'sumdiff', total: total, diff: D } };
  });

  fam('race', 1, function (r, turn) {
    const k = walk(r, turn, [2, 3, 4, 5]);
    return { q: 'You overtake the runner in ' + ord(k) + ' place. What place are you in now?', ordinal: true, a: k, baits: [k - 1], why: 'You take their place, so you are ' + ord(k) + '. Everyone ahead of them is still ahead of you.', v: { t: 'race', k: k } };
  });

  fam('sibling', 1, function (r) {
    if (r() < 0.6) {
      const a = pick(r, [4, 6, 8, 10]), N = pick(r, [30, 40, 50, 60, 70, 100]);
      return { q: 'When I was ' + a + ', my sister was half my age. I am ' + N + ' now. How old is she?', suf: 'years old', a: N - a / 2, baits: [N / 2], why: 'She was ' + (a / 2) + ' years younger then, and she still is. ' + N + ' − ' + (a / 2) + ' = ' + (N - a / 2) + '.', v: { t: 'sibling', mode: 'half', a: a, N: N } };
    }
    const a = pick(r, [5, 6, 8, 10]), N = pick(r, [20, 30, 40, 50]);
    return { q: 'When I was ' + a + ', my brother was twice my age. I am ' + N + ' now. How old is he?', suf: 'years old', a: N + a, baits: [2 * N], why: 'He was ' + a + ' years older then, and he still is. ' + N + ' + ' + a + ' = ' + (N + a) + '.', v: { t: 'sibling', mode: 'twice', a: a, N: N } };
  });

  fam('queue', 1, function (r) {
    const a = 5 + Math.floor(r() * 16);
    return { q: 'You are ' + ord(a) + ' from the front of a queue and ' + ord(a) + ' from the back. How many people are in it?', suf: 'people', a: 2 * a - 1, baits: [2 * a], why: 'Adding ' + a + ' and ' + a + ' counts you twice. Take one off.', v: { t: 'counting', mode: 'queue', a: a, b: a } };
  });

  fam('socks', 1, function (r) {
    const three = r() < 0.4;
    const A = pick(r, [6, 8, 10, 12]), B = pick(r, [6, 8, 10, 12]), C = pick(r, [6, 8, 10]);
    const counts = three ? [A, B, C] : [A, B];
    const list = three ? A + ' black, ' + B + ' white and ' + C + ' grey socks' : A + ' black socks and ' + B + ' white socks';
    return { q: 'A drawer has ' + list + '. In the dark, how many must you pull out to be sure of a matching pair?', suf: 'socks', a: counts.length + 1, baits: [2, Math.max.apply(null, counts) + 1], why: 'Your first ' + counts.length + ' could all be different colours. The next one has to match one of them.', v: { t: 'socks', mode: 'any', counts: counts } };
  });

  fam('corners', 1, function (r, turn) {
    const p = walk(r, turn, [['square table', 4], ['triangular road sign', 3], ['rectangular sheet of paper', 4], ['hexagonal tile', 6], ['five-sided badge', 5]]);
    return { q: 'A ' + p[0] + ' has ' + p[1] + ' corners. You cut one corner off. How many corners does it have now?', suf: 'corners', a: p[1] + 1, baits: [p[1] - 1], why: 'The cut removes one corner and leaves two new ones in its place.', v: { t: 'corners', n: p[1] } };
  });

  fam('hands', 1, function (r, turn) {
    const p = walk(r, turn, [['You have 10 fingers on 2 hands. How many fingers are on 10 hands?', 'fingers', 10], ['You have 10 toes on 2 feet. How many toes are on 10 feet?', 'toes', 10], ['You have 10 fingers on 2 hands. How many fingers are on 100 hands?', 'fingers', 100]]);
    return { q: p[0], suf: p[1], a: p[2] * 5, baits: [p[2] * 10], why: 'There are 5 on each one, not 10. ' + p[2] + ' × 5 = ' + (p[2] * 5) + '.', v: { t: 'hands', n: p[2] } };
  });

  fam('divhalf', 1, function (r) {
    if (r() < 0.6) {
      const a = pick(r, [6, 8, 10, 12, 20, 30, 50]);
      return { q: 'What is ' + a + ' divided by a half?', a: 2 * a, baits: [a / 2], why: 'Dividing by a half asks how many halves fit into ' + a + '. That is ' + (2 * a) + '. Halving it would be dividing by 2.', v: { t: 'divhalf', a: a, b: 0 } };
    }
    const a = pick(r, [10, 20, 30, 40]), b = pick(r, [5, 10]);
    return { q: 'Divide ' + a + ' by a half and add ' + b + '. What do you get?', a: 2 * a + b, baits: [a / 2 + b], why: 'Dividing by a half doubles it: ' + a + ' ÷ ½ = ' + (2 * a) + '. Then add ' + b + '.', v: { t: 'divhalf', a: a, b: b } };
  });

  fam('dry', 1, function (r, turn) {
    const p = walk(r, turn, [
      ['5 shirts take 5 hours to dry on a washing line. How many hours do 10 shirts take?', 'hours', 5, [10], 'They all dry at the same time. More shirts need more line, not more hours.'],
      ['An orchestra of 60 plays a symphony in 40 minutes. How many minutes does an orchestra of 120 take?', 'minutes', 40, [20, 80], 'The music is the same length however many people play it.'],
      ['It takes 6 minutes to boil 1 egg. How many minutes does it take to boil 4 eggs in the same pot?', 'minutes', 6, [24], 'They boil side by side, so 4 eggs take the same 6 minutes.'],
      ['One candle burns for 3 hours. How many hours do 4 candles last if you light them all together?', 'hours', 3, [12], 'Lit together, they all burn down over the same 3 hours.']
    ]);
    return { q: p[0], suf: p[1], a: p[2], baits: p[3], why: p[4], v: { t: 'dry', each: p[2] } };
  });

  // Number riddles: nothing to work out, just a question most people do not quite hear.
  // The bar is "I should have caught that", never "how was I meant to know". So: no puns, no
  // trivia, and nothing that hangs on an assumption the question does not state.
  fam('listen', 1, function (r, turn) {
    const pickOne = walk(r, turn, ['sheep', 'stamps']);
    if (pickOne === 'sheep') {
      const p = pick(r, [[17, 9], [20, 8], [15, 6], [23, 9]]);
      return { q: 'A farmer has ' + p[0] + ' sheep. All but ' + p[1] + ' run away. How many does he have left?', suf: 'sheep', a: p[1], baits: [p[0] - p[1]], why: '“All but ' + p[1] + '” means ' + p[1] + ' stayed. Nothing to subtract.', v: { t: 'listen', id: 'sheep', n: p[0], k: p[1] } };
    }
    const k = pick(r, [2, 3, 4, 6]);
    return { q: 'How many ' + k + '-cent stamps are there in a dozen?', suf: 'stamps', a: 12, baits: [12 / k], why: 'A dozen of anything is 12. The price is only there to make you divide.', v: { t: 'listen', id: 'stamps' } };
  });

  fam('picture', 1, function (r, turn) {
    const list = [
      { q: 'A square room has a cat in every corner. Each cat can see 3 cats. How many cats are in the room?', suf: 'cats', a: 4, baits: [12, 16], why: 'Four corners, four cats. Each one sees the other three.', v: { t: 'listen', id: 'cats' } },
      { q: 'Some months have 30 days and some have 31. How many months have 28 days?', suf: 'months', a: 12, baits: [1], why: 'All 12. Every month gets to its 28th day; February just stops there.', v: { t: 'listen', id: 'months' } },
      { q: 'Two fathers and two sons go fishing. Each catches one fish, and they bring home just 3 fish. How many people went fishing?', suf: 'people', a: 3, baits: [4], why: 'A grandfather, his son and his grandson. The man in the middle is both a father and a son.', v: { t: 'listen', id: 'fathers' } }
    ];
    return list[typeof turn === 'number' ? turn % list.length : Math.floor(r() * list.length)];
  });

  /* ---------- Level 2: the classic traps. ---------- */

  fam('rates', 2, function (r) {
    const mode = pick(r, ['time', 'workers', 'count']);
    if (mode === 'time') {
      const s = pick(r, [['machines', 'widgets'], ['bakers', 'loaves'], ['printers', 'posters']]);
      const n = pick(r, [3, 4, 5, 6]), M = pick(r, [50, 100, 200]);
      return { q: n + ' ' + s[0] + ' make ' + n + ' ' + s[1] + ' in ' + n + ' minutes. How many minutes do ' + M + ' ' + s[0] + ' take to make ' + M + ' ' + s[1] + '?', suf: 'minutes', a: n, baits: [M], why: 'Each one takes ' + n + ' minutes to make one. ' + M + ' working at once make ' + M + ' in the same ' + n + ' minutes.', v: { t: 'rates', mode: mode, n: n, M: M } };

  function keyBtn(k) { return '<button data-act="key" data-k="' + k + '">' + k + '</button>'; }

  // The top of every question is one instrument: the lights on the left, the clock on the right, and

  }

    else if (act === 'pgo') partyAnswer();
    else if (act === 'preveal') partyReveal();
    else if (act === 'pnext') partyNext();
    else if (act === 'pagain') startParty(game.players.map(function (p) { return p.name; }), game.set.length);
    else if (act === 'pshare') { send(partyShare(), 'Result copied. Paste it anywhere.'); track('share', { what: 'party', mode: 'party' }); }
  }
  document.addEventListener('keydown', function (e) { try { typedKey(e); } catch (x) { oops(x); } });
  function typedKey(e) {
    if (e.key === 'Enter' && e.repeat) { e.preventDefault(); return; }   // a held key must not run through the screens
    if (!veil.hidden) { if (e.key === 'Escape') closeSheet(); else if (e.key === 'Enter' && document.getElementById('code')) deal(); return; }
    if (ask) {
      if (/^[0-9]$/.test(e.key)) key(e.key);
      else if (e.key === '.' || e.key === ',') key('.');
      else if (e.key === 'Backspace') { key('del'); e.preventDefault(); }
      else if (e.key === 'Enter') { lock(false); e.preventDefault(); }
    } else if (e.key === 'Enter' && !pending) {
      var b = view.querySelector('[data-enter]');
      if (b && !(b.closest('.hid'))) { b.click(); e.preventDefault(); }
    }
  }

  /* ---------- Keeping up with other tabs, with midnight, and with a page that was put away ---------- */
  function heard() {
    var was = store.daily;
    if (adopt()) save();
    if (game && game.mode === 'daily') {
      if (store.daily !== was && store.daily && store.daily.day === game.day) startDaily();   // another tab played on: show where things stand
      else if (store.daily !== was) { store.daily = was; }
    } else if (onHome() && sig() !== homeSig) home();
  }
  window.addEventListener('storage', function (e) { if (e.key === KEY) { try { heard(); } catch (x) { oops(x); } } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { try { heard(); } catch (x) { oops(x); } } });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { try { heard(); } catch (x) { oops(x); } } });
  window.addEventListener('hashchange', function () {   // a friend's link pasted into a tab that is already open
    try { var h = readLink(); if (h === 'numbers' && !game) numbers(); else if (onHome() || (game && game.mode === 'daily' && game.st.done)) home(); } catch (x) { oops(x); }
  });

  /* ---------- Boot ---------- */
  function start(snap) {
    if (!hadLocal && snap && snap.store && typeof snap.store === 'object' && snap.store.stats) store = clean(snap.store);
    paintSound();
    var h = readLink();
    if (h === 'numbers') numbers();
    else if (resume()) { /* back in endless mode, the party or the private round they were in */ }
    else if (dailyState() === 'going') startDaily();   // a refresh mid-game goes back to the question, where the one clock is still running
    else home();   // everyone else, new or not, starts at the front page: the goal, the lights, one button
  }
  function boot(snap) {
    try { start(snap); loadAnalytics(); }
    catch (e) {   // should be impossible; if it is not, drop the game in progress and keep the record
      oops(e); stopTimers(); game = null; ask = null; store.live = null; store.daily = null; store.rival = null; save();
      try { home(); } catch (e2) { /* the bar offers a reload */ }
    }
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { store: store }; });
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();

</script>
