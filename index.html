<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not So Fast</title>
<meta name="description" content="Three maths questions a day. One guess each. Your first answer is usually wrong.">
<meta property="og:title" content="Not So Fast">
<meta property="og:description" content="Three maths questions a day. One guess each. Your first answer is usually wrong.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://playnotsofast.com/">
<meta property="og:image" content="https://playnotsofast.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect x='2' y='12' width='8' height='8' fill='%23d39e1e'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23787c7e'/%3E%3Crect x='22' y='12' width='8' height='8' fill='%234c9a52'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root {
  /* Layout: a narrow centred column like a newspaper puzzle. Thin rule under the title,
     a board of three guess rows, a flat grey keyboard. System fonts only. Colour appears
     only when a guess is scored: green right, amber the trap, grey wrong. */
  --bg: #ffffff;
  --ink: #1a1a1b;
  --muted: #787c7e;
  --line: #d3d6da;
  --edge: #878a8c;
  --key: #d3d6da;
  --green: #4c9a52;
  --amber: #d39e1e;
  --grey: #787c7e;
  --on: #ffffff;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121213; --ink: #f5f5f5; --muted: #8e9092; --line: #3a3a3c; --edge: #565758; --key: #818384; --green: #4a8f4e; --amber: #b98a1a; --grey: #3a3a3c; --on: #ffffff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121213; --ink: #f5f5f5; --muted: #8e9092; --line: #3a3a3c; --edge: #565758; --key: #818384; --green: #4a8f4e; --amber: #b98a1a; --grey: #3a3a3c; --on: #ffffff; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 500px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 52px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.name { font-weight: 700; font-size: 1.375rem; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; white-space: nowrap; }
.ico { width: 40px; height: 40px; display: grid; place-items: center; font-weight: 700; font-size: 1.125rem; border-radius: 50%; }
.ico svg { width: 22px; height: 22px; }
main { flex: 1; display: flex; flex-direction: column; padding: 0 16px 16px; }

.pill { display: block; min-width: 180px; height: 48px; padding: 0 28px; margin: 0 auto; border-radius: 24px; font-weight: 700; font-size: 1rem; }
.pill.dark { background: var(--ink); color: var(--bg); }
.pill.line { border: 1px solid var(--ink); }
.pill.green { background: var(--green); color: var(--on); }
.pill.wide { width: 100%; }

/* Splash */
.splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px 8px; }
.logo { display: flex; gap: 5px; }
.logo i { width: 34px; height: 34px; }
.logo .a { background: var(--amber); } .logo .x { background: var(--grey); } .logo .ok { background: var(--green); }
.splash h1 { margin: 6px 0 0; font-size: 2.25rem; font-weight: 700; letter-spacing: 0.01em; }
.tag { margin: 0 0 10px; max-width: 18em; font-size: 1.25rem; line-height: 1.3; }
.splash .pill + .pill { margin-top: -2px; }
.date { margin: 12px 0 0; font-size: 0.9375rem; }
.date span { display: block; color: var(--muted); }

/* Play */
.play { flex: 1; display: flex; flex-direction: column; padding-top: 14px; }
.steps { display: flex; justify-content: center; gap: 6px; }
.steps i { width: 14px; height: 14px; border: 2px solid var(--line); }
.steps i.now { border-color: var(--ink); }
.steps i.ok { background: var(--green); border-color: var(--green); }
.steps i.no { background: var(--grey); border-color: var(--grey); }
.steps i.trap { background: var(--amber); border-color: var(--amber); }
.bar { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px; }
.count { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.clock { font-size: 1.125rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--amber); }
.clock.stop { color: var(--muted); }
.drain { height: 3px; margin-top: 6px; background: var(--line); }
.drain i { display: block; height: 100%; background: var(--ink); transition: width 0.2s linear; }
.drain i.low { background: var(--amber); }
.q { margin: 14px 0 18px; font-size: 1.1875rem; line-height: 1.38; text-align: center; text-wrap: balance; }
.q.long { text-align: left; font-size: 1.0625rem; text-wrap: pretty; }
.board { display: grid; gap: 6px; max-width: 340px; width: 100%; margin: 0 auto; }
.row { display: grid; grid-template-columns: 1fr 58px; gap: 6px; --c: var(--grey); }
.row.f-right { --c: var(--green); } .row.f-bait { --c: var(--amber); }
.row.f-right.reveal { animation: hop 0.45s ease 0.55s; }
.tile, .mark { height: 58px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); font-weight: 700; text-transform: uppercase; }
.tile { gap: 6px; font-size: 1.75rem; font-variant-numeric: tabular-nums; }
.tile .u { font-size: 0.8125rem; letter-spacing: 0.04em; }
.mark { font-size: 1.375rem; }
.mark.word { font-size: 0.75rem; letter-spacing: 0.06em; }
.row.cur.has .tile { border-color: var(--edge); }
.row.set .tile, .row.set .mark { background: var(--c); border-color: var(--c); color: var(--on); }
.row.reveal .tile, .row.reveal .mark { animation: flip 0.5s ease both; }
.row.reveal .mark { animation-delay: 0.18s; }
.row.shake { animation: shake 0.4s; }
.tile.pop { animation: pop 0.1s; }
@keyframes flip {
  0% { transform: rotateX(0); background: var(--bg); color: var(--ink); border-color: var(--edge); }
  45% { transform: rotateX(90deg); background: var(--bg); color: var(--ink); border-color: var(--edge); }
  55% { transform: rotateX(90deg); background: var(--c); color: var(--on); border-color: var(--c); }
  100% { transform: rotateX(0); background: var(--c); color: var(--on); border-color: var(--c); }
}
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 70% { transform: translateY(3px); } }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
.foot { margin-top: auto; padding-top: 18px; }
.foot.done { margin-top: 0; padding-top: 22px; }
.keys { display: grid; gap: 8px; }
.keys div { display: flex; gap: 6px; }
.keys button { flex: 1; height: 54px; border-radius: 4px; background: var(--key); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; }
.keys button.w { flex: 1.6; font-size: 0.8125rem; }
.keys button:active { opacity: 0.7; }
.after { max-width: 340px; margin: 0 auto; text-align: center; }
.verdict { margin: 0 0 6px; font-size: 1.75rem; font-weight: 700; color: var(--green); }
.verdict span { margin-left: 8px; font-size: 1rem; font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
.note { margin: 0 0 6px; font-size: 0.9375rem; font-weight: 700; }
.crowd { margin: 0 0 10px; min-height: 1.4em; font-size: 0.9375rem; color: var(--muted); }
.ans { margin: 0 0 8px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ans b { display: block; margin-top: 2px; font-size: 1.75rem; letter-spacing: 0; text-transform: none; color: var(--ink); }
.why { margin: 0 0 16px; text-align: left; font-size: 0.9375rem; }

.toast { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 4px; font-weight: 700; font-size: 0.875rem; white-space: nowrap; pointer-events: none; }

/* End + stats */
.end { padding-top: 22px; text-align: center; }
.end h2, .sheet h2 { margin: 0 0 12px; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.score { margin: 0 0 12px; font-size: 2.25rem; font-weight: 700; }
.grid { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.grid i { width: 44px; height: 44px; background: var(--grey); }
.total { margin: 0 0 22px; font-variant-numeric: tabular-nums; }
.grid i.right { background: var(--green); } .grid i.bait { background: var(--amber); }
.nums { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
.nums div { width: 78px; }
.nums b { display: block; font-size: 2rem; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.nums span { font-size: 0.75rem; }
.dist { max-width: 300px; margin: 0 auto 22px; display: grid; gap: 4px; }
.dist div { display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: center; font-size: 0.875rem; font-weight: 700; }
.dist i { display: block; min-width: 26px; padding: 1px 8px; background: var(--grey); color: var(--on); font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.dist i.hi { background: var(--green); }
.endrow { display: grid; grid-template-columns: 1fr 1fr; align-items: center; max-width: 340px; margin: 0 auto 10px; }
.endrow > div { border-right: 1px solid var(--ink); padding: 4px 0; }
.endrow span { display: block; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.endrow b { font-size: 1.75rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.endrow .pill { min-width: 0; width: 130px; }
.sharetext { margin: 10px auto 0; max-width: 340px; padding: 10px; border: 1px dashed var(--edge); font-family: var(--font); font-size: 0.9375rem; white-space: pre-wrap; text-align: left; user-select: all; -webkit-user-select: all; }
.recap { list-style: none; margin: 22px 0 0; padding: 0; text-align: left; }
.recap li { padding: 12px 0; border-top: 1px solid var(--line); }
.recap p { margin: 0; font-size: 0.9375rem; }
.recap .ra { margin-top: 4px; font-weight: 700; }
.recap .mini { display: inline-flex; gap: 3px; margin-right: 8px; vertical-align: -2px; }
.recap .rt { margin-left: 8px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.recap .mini i { width: 14px; height: 14px; background: var(--grey); }
.recap .mini i.right { background: var(--green); } .recap .mini i.bait { background: var(--amber); }
.endbtns { display: grid; gap: 10px; max-width: 340px; margin: 18px auto 0; }

/* Sheets */
.veil { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 60%, transparent); display: flex; align-items: flex-start; justify-content: center; padding: 56px 12px 12px; overflow: auto; }
.sheet { width: 100%; max-width: 440px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 23px rgba(0, 0, 0, 0.2); padding: 14px 18px 22px; }
.sheet-top { display: flex; justify-content: flex-end; }
.sheet .big { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; text-align: left; letter-spacing: 0; text-transform: none; }
.sheet p { margin: 0 0 12px; }
.sheet .small { font-size: 0.8125rem; color: var(--muted); margin: 0; }
.sheet ul { margin: 0 0 14px; padding-left: 1.2em; }
.sheet li { margin-bottom: 4px; }
.eg { margin: 14px 0; padding-top: 12px; border-top: 1px solid var(--line); }
.eg .row { max-width: 240px; margin-bottom: 6px; }
.eg .tile, .eg .mark { height: 42px; font-size: 1.125rem; }
.eg .row { grid-template-columns: 1fr 42px; }
.eg .mark.word { font-size: 0.5625rem; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .lab { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field input { width: 100%; height: 52px; border: 2px solid var(--edge); border-radius: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.2em; text-align: center; text-transform: uppercase; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; }
.stepper button { height: 52px; background: var(--key); border-radius: 4px; font-size: 1.5rem; font-weight: 700; }
.stepper output { text-align: center; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.linkish { justify-self: start; padding: 4px 0; text-decoration: underline; font-size: 0.9375rem; }

@media (max-height: 640px) { .tile, .mark { height: 48px; } .row { grid-template-columns: 1fr 48px; } .keys button { height: 46px; } .q { margin: 10px 0 12px; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { .row.reveal .tile, .row.reveal .mark, .row.shake, .tile.pop, .row.f-right.reveal { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ico" data-act="help" aria-label="How to play">?</button>
    <button class="name" data-act="home" id="brand"></button>
    <button class="ico" data-act="stats" aria-label="Statistics">
      <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="11" width="4" height="9" fill="currentColor"></rect><rect x="9" y="5" width="4" height="15" fill="currentColor"></rect><rect x="16" y="2" width="4" height="18" fill="currentColor"></rect></svg>
    </button>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="veil" class="veil" hidden></div>

<script>
/* Bait engine: seeded puzzle families. No DOM in this file. */
(function (root) {
  'use strict';

  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFrom(str) { return mulberry32(xmur3(str)()); }
  function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function shuffle(r, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function num(n) {
    const v = Math.round(n * 100) / 100;
    return v.toLocaleString('en-GB', { maximumFractionDigits: 2 });
  }
  function eur(n) { return '€' + num(n); }
  function cents(c) { return '€' + (c / 100).toFixed(2); }
  function ord(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function lcm(a, b) { return a * b / gcd(a, b); }
  function pl(n, one, many) { return n === 1 ? one : many; }
  function walk(r, turn, list) { return typeof turn === 'number' ? list[turn % list.length] : pick(r, list); }

  const F = [];
  function fam(id, level, gen) { F.push({ id: id, level: level, gen: gen }); }

  /* ---------- Level 1 ---------- */

  fam('sumdiff', 1, function (r) {
    if (r() < 0.5) {
      const p = pick(r, [['bat', 'ball'], ['racket', 'shuttlecock'], ['burger', 'drink'], ['coffee', 'biscuit'], ['magazine', 'pen'], ['sandwich', 'banana']]);
      const D = pick(r, [100, 200]);
      const c = pick(r, [5, 10, 15, 20, 25, 30, 40, 45]) * (D / 100);
      const total = D + 2 * c;
      return {
        q: 'A ' + p[0] + ' and a ' + p[1] + ' cost ' + cents(total) + ' together. The ' + p[0] + ' costs ' + cents(D) + ' more than the ' + p[1] + '. How much is the ' + p[1] + '?',
        suf: 'cents', a: c, baits: [2 * c],
        why: 'If the ' + p[1] + ' were ' + (2 * c) + ' cents, the ' + p[0] + ' would be ' + cents(2 * c + D) + ' and the pair would cost ' + cents(4 * c + D) + '. At ' + c + ' cents it adds up: ' + cents(c) + ' plus ' + cents(c + D) + '.',
        v: { t: 'sumdiff', total: total, diff: D }
      };
    }
    const p = pick(r, [['laptop', 'mouse'], ['bike', 'helmet'], ['TV', 'remote'], ['guitar', 'strap'], ['sofa', 'cushion'], ['phone', 'case']]);
    const D = pick(r, [100, 500, 1000]);
    const c = pick(r, D === 100 ? [5, 10, 15, 20, 25] : D === 500 ? [20, 25, 30, 40, 50] : [25, 50, 75, 100]);
    const total = D + 2 * c;
    return {
      q: 'A ' + p[0] + ' and a ' + p[1] + ' cost ' + eur(total) + ' together. The ' + p[0] + ' costs ' + eur(D) + ' more than the ' + p[1] + '. How much is the ' + p[1] + '?',
      pre: '€', a: c, baits: [2 * c],
      why: 'If the ' + p[1] + ' were ' + eur(2 * c) + ', the ' + p[0] + ' would be ' + eur(2 * c + D) + ' and the pair would cost ' + eur(4 * c + D) + '. At ' + eur(c) + ' it adds up: ' + eur(c) + ' plus ' + eur(c + D) + '.',
      v: { t: 'sumdiff', total: total, diff: D }
    };
  });

  fam('rates', 1, function (r) {
    const mode = pick(r, ['time', 'count', 'workers', 'half']);
    if (mode === 'time') {
      const s = pick(r, [['machines', 'widgets'], ['bakers', 'loaves'], ['printers', 'posters'], ['robots', 'toys']]);
      const n = pick(r, [3, 4, 5, 6, 8]);
      const M = pick(r, [20, 50, 100, 200]);
      return {
        q: n + ' ' + s[0] + ' take ' + n + ' minutes to make ' + n + ' ' + s[1] + '. How many minutes do ' + M + ' ' + s[0] + ' take to make ' + M + ' ' + s[1] + '?',
        suf: 'minutes', a: n, baits: [M],
        why: 'Each of the ' + s[0] + ' makes one of the ' + s[1] + ' in ' + n + ' minutes. ' + M + ' working side by side make ' + M + ' in the same ' + n + ' minutes.',
        v: { t: 'rates', mode: mode, n: n, M: M }
      };
    }
    if (mode === 'half') {
      const p = pick(r, [[3, 3], [6, 6], [3, 6], [6, 3], [9, 3]]);
      const H = p[0], D = p[1], ans = H * D * 2 / 3;
      return {
        q: 'A hen and a half lays an egg and a half in a day and a half. How many eggs do ' + H + ' hens lay in ' + D + ' days?',
        suf: 'eggs', a: ans, baits: [Math.max(H, D), H * D],
        why: 'Scale it down: one hen lays one egg in a day and a half, which is 2 eggs every 3 days. ' + H + ' hens over ' + D + ' days lay ' + ans + '.',
        v: { t: 'rates', mode: mode, H: H, D: D }
      };
    }
    if (mode === 'count') {
      const s = pick(r, [['hens', 'lay', 'eggs', 'days', 'hen', 'egg'], ['bakers', 'bake', 'cakes', 'hours', 'baker', 'cake'], ['cats', 'catch', 'mice', 'minutes', 'cat', 'mouse']]);
      const n = pick(r, [2, 3, 4, 5]);
      const k = pick(r, [2, 3, 4]);
      return {
        q: n + ' ' + s[0] + ' ' + s[1] + ' ' + n + ' ' + s[2] + ' in ' + n + ' ' + s[3] + '. How many ' + s[2] + ' do ' + (k * n) + ' ' + s[0] + ' ' + s[1] + ' in ' + (k * n) + ' ' + s[3] + '?',
        suf: s[2], a: k * k * n, baits: [k * n],
        why: 'One ' + s[4] + ' manages one ' + s[5] + ' every ' + n + ' ' + s[3] + ', so ' + k + ' in ' + (k * n) + ' ' + s[3] + '. With ' + (k * n) + ' of them that is ' + (k * n) + ' × ' + k + ' = ' + (k * k * n) + '.',
        v: { t: 'rates', mode: mode, n: n, k: k }
      };
    }
    const s = pick(r, [['cats', 'catch', 'mice', 'minutes'], ['mechanics', 'fix', 'cars', 'hours'], ['chefs', 'plate', 'dishes', 'minutes']]);

  // Parked: these read like homework, so version 2 leaves them out of every set.
  const PARKED = ['order', 'ratio', 'growth', 'avgneeded', 'markup', 'vat', 'pctpoints', 'offers', 'weighted'];
  const LEVEL = { intervals: 1, jointwork: 2, digits: 2, clock: 2, inverse: 2 };

  const BY = { 1: F.filter(function (f) { return f.level === 1; }), 2: F.filter(function (f) { return f.level === 2; }), 3: F.filter(function (f) { return f.level === 3; }) };
  const PER = { 1: 1, 2: 1, 3: 1 };

  // Each level runs in cycles: every family appears once per cycle, and a family
  // never appears on the last day of one cycle and the first day of the next.
  function cycleOrder(level, target) {
    const fams = BY[level], k = PER[level], days = Math.floor(fams.length / k);
    let prev = null, sh = null;
    for (let c = 0; c <= target; c++) {
      sh = shuffle(rngFrom('cycle-' + level + '-' + c), fams);
      if (prev) {
        for (let tries = 0; tries < days; tries++) {
          const first = sh.slice(0, k);
          if (!first.some(function (f) { return prev.indexOf(f) >= 0; })) break;
          sh = sh.slice(k).concat(first);
        }
      }
      prev = sh.slice((days - 1) * k, days * k);
    }
    return sh;
  }
  function daySlice(level, i) {
    const k = PER[level], days = Math.floor(BY[level].length / k);
    const order = cycleOrder(level, Math.floor(i / days));
    const j = i % days;
    return { fams: order.slice(j * k, j * k + k), turn: Math.floor(i / days) };

    const q = f.gen(rngFrom(seed + '-' + f.id), turn);

    q.a = Math.round(q.a * 1e6) / 1e6;
    q.pre = q.pre || ''; q.suf = q.suf || '';
    q.baits = (q.baits || []).filter(function (b, i, arr) {
      return isFinite(b) && b >= 0 && Math.abs(b - q.a) > 0.006 && arr.indexOf(b) === i;
    });
    return q;
  }

    const i = Math.max(0, day - 1);
    return [1, 2, 3].map(function (level, n) {
      const s = daySlice(level, i);
      return make(s.fams[0], 'daily-' + day + '-' + n, s.turn);
    });

  function buildTable(code, round) {
    const key = 'table-' + code + '-' + round;
    const r = rngFrom(key);
    const fams = [pick(r, BY[1]), pick(r, BY[2]), pick(r, BY[3])];
    return fams.map(function (f, n) { return make(f, key + '-' + n); });
  }

  function dayNumber(date) {
    const t = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.max(1, Math.round((t - EPOCH) / 86400000) + 1);
  }

  function judge(q, text) {
    const v = parseFloat(text);
    if (text === '' || text === '.' || !isFinite(v)) return 'bad';
    if (Math.abs(v - q.a) <= 0.006) return 'right';
    for (let i = 0; i < q.baits.length; i++) {
      const b = q.baits[i];
      const tol = Math.abs(b - Math.round(b)) < 1e-9 ? 0.006 : 0.5;
      if (Math.abs(v - b) <= tol) return 'bait';
    }
    if (typeof q.baitBelow === 'number' && v < q.baitBelow) return 'bait';
    if (typeof q.baitAbove === 'number' && v > q.baitAbove) return 'bait';
    return v < q.a ? 'low' : 'high';

    if (q.ordinal) return ord(v);
    const tight = q.suf === '%' || q.suf === '°';
    return q.pre + num(v) + (q.suf ? (tight ? '' : ' ') + q.suf : '');

    if (!t) { if (e.target === veil) closeSheet(); return; }
    var act = t.getAttribute('data-act');
    if (act === 'key') key(t.getAttribute('data-k'));
    else if (act === 'enter') lock(false);
    else if (act === 'next') next();
    else if (act === 'daily') startDaily();
    else if (act === 'table') tableSheet();
    else if (act === 'help') help();
    else if (act === 'stats') stats();
    else if (act === 'close') closeSheet();
    else if (act === 'copy') copy();
    else if (act === 'home') { closeSheet(); home(); }
    else if (act === 'deal') deal();
    else if (act === 'rand') { table.code = randomCode(); var c = document.getElementById('code'); if (c) c.value = table.code; }
    else if (act === 'round-' || act === 'round+') {
      table.round = Math.max(1, Math.min(99, table.round + (act === 'round+' ? 1 : -1)));
      var o = document.getElementById('round'); if (o) o.textContent = table.round;
    }
    else if (act === 'nextround') { table.round = game.round + 1; startTable(game.code, table.round); }
  });
  document.addEventListener('keydown', function (e) {
    if (!veil.hidden) { if (e.key === 'Escape') closeSheet(); else if (e.key === 'Enter' && document.getElementById('code')) deal(); return; }
    if (!game || game.st.done) return;
    if (game.st.res[game.st.idx]) { if (e.key === 'Enter') { next(); e.preventDefault(); } return; }
    if (/^[0-9]$/.test(e.key)) key(e.key);
    else if (e.key === '.' || e.key === ',') key('.');
    else if (e.key === 'Backspace') { key('del'); e.preventDefault(); }
    else if (e.key === 'Enter') { lock(false); e.preventDefault(); }
  });

  /* ---------- Boot ---------- */
  function start(snap) {
    if (!hadLocal && snap && snap.store && snap.store.stats && snap.store.stats.dist) store = snap.store;
    home();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { store: store }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
